spring.application.name=poketcg-api
spring.datasource.url=jdbc:h2:file:./data/poketcg;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true
spring.task.scheduling.pool.size=1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

poketcg.sync.enabled=true
poketcg.sync.cron=0 0 4 * * *
poketcg.dataset.owner=PokemonTCG
poketcg.dataset.repo=pokemon-tcg-data
poketcg.dataset.branch=master
poketcg.dataset.github-api-base-url=https://api.github.com
poketcg.dataset.codeload-base-url=https://codeload.github.com
