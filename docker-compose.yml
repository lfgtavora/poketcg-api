services:
  api:
    build: .
    image: poketcg-api:local
    ports:
      - "8080:8080"
    volumes:
      - poketcg-data:/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/poketcg;AUTO_SERVER=TRUE
      POKETCG_SYNC_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  poketcg-data:
